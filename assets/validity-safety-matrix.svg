<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .title { font: bold 18px sans-serif; fill: #1a1a1a; }
      .axis-label { font: bold 14px sans-serif; fill: #333; }
      .quadrant-title { font: bold 16px sans-serif; }
      .quadrant-text { font: 12px sans-serif; fill: #444; }
      .bullet { font: 11px sans-serif; fill: #555; }
      .defense { font: italic 11px sans-serif; fill: #666; }
      .highlight { font: bold 13px sans-serif; fill: #c00; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">The Validity-Safety Matrix</text>
  <text x="400" y="55" text-anchor="middle" style="font: 12px sans-serif; fill: #666;">Traditional security assumes validity and safety are correlated. SEA reveals they are orthogonal.</text>
  
  <!-- Axes -->
  <!-- Vertical axis (Stability) -->
  <line x1="400" y1="90" x2="400" y2="550" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="80" text-anchor="middle" class="axis-label">SYSTEM STABILITY</text>
  <text x="385" y="105" text-anchor="end" style="font: 11px sans-serif; fill: #666;">Unsafe</text>
  <text x="385" y="545" text-anchor="end" style="font: 11px sans-serif; fill: #666;">Stable</text>
  
  <!-- Horizontal axis (Policy Adherence) -->
  <line x1="100" y1="320" x2="700" y2="320" stroke="#333" stroke-width="2"/>
  <text x="720" y="325" class="axis-label">POLICY ADHERENCE</text>
  <text x="250" y="340" text-anchor="middle" style="font: 11px sans-serif; fill: #666;">Invalid</text>
  <text x="550" y="340" text-anchor="middle" style="font: 11px sans-serif; fill: #666;">Valid</text>
  
  <!-- Quadrant boxes -->
  <!-- Top-Left: Classic Exploits -->
  <rect x="120" y="100" width="260" height="200" fill="#fee" stroke="#c66" stroke-width="2" rx="8"/>
  <text x="250" y="125" text-anchor="middle" class="quadrant-title" fill="#a33">CLASSIC EXPLOITS</text>
  <text x="140" y="150" class="bullet">• SQL Injection</text>
  <text x="140" y="170" class="bullet">• Buffer Overflow</text>
  <text x="140" y="190" class="bullet">• XSS</text>
  <text x="140" y="220" class="defense">Defense:</text>
  <text x="140" y="240" class="bullet">Validation, WAF, Patches</text>
  <text x="140" y="260" class="bullet">CVE databases</text>
  
  <!-- Top-Right: Lawful Instability (THE BLIND SPOT) -->
  <rect x="420" y="100" width="260" height="200" fill="#ffe4e4" stroke="#c00" stroke-width="3" rx="8"/>
  <text x="550" y="125" text-anchor="middle" class="quadrant-title" fill="#c00">LAWFUL INSTABILITY</text>
  <text x="550" y="145" text-anchor="middle" class="highlight">⚠ THE BLIND SPOT</text>
  <text x="440" y="170" class="bullet">• MEV Attacks</text>
  <text x="440" y="190" class="bullet">• State Bloat</text>
  <text x="440" y="210" class="bullet">• Bank Runs</text>
  <text x="440" y="240" class="defense">Defense:</text>
  <text x="440" y="260" class="bullet">Conservation Invariants (SEA)</text>
  <text x="440" y="280" class="bullet">Global constraints, not patches</text>
  
  <!-- Bottom-Left: Fuzzing / Junk Data -->
  <rect x="120" y="360" width="260" height="180" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="8"/>
  <text x="250" y="385" text-anchor="middle" class="quadrant-title" fill="#666">FUZZING / JUNK DATA</text>
  <text x="140" y="410" class="bullet">• Random inputs</text>
  <text x="140" y="430" class="bullet">• Malformed packets</text>
  <text x="140" y="460" class="defense">Defense:</text>
  <text x="140" y="480" class="bullet">Input validation</text>
  <text x="140" y="500" class="bullet">Schema enforcement</text>
  
  <!-- Bottom-Right: Normal Usage -->
  <rect x="420" y="360" width="260" height="180" fill="#efe" stroke="#6a6" stroke-width="1" rx="8"/>
  <text x="550" y="385" text-anchor="middle" class="quadrant-title" fill="#383">NORMAL USAGE</text>
  <text x="440" y="410" class="bullet">• Legitimate transactions</text>
  <text x="440" y="430" class="bullet">• Expected behavior</text>
  <text x="440" y="460" class="defense">Status:</text>
  <text x="440" y="480" class="bullet">Desired operating state</text>
  <text x="440" y="500" class="bullet">System functions as intended</text>
  
  <!-- Footer note -->
  <text x="400" y="580" text-anchor="middle" style="font: italic 11px sans-serif; fill: #888;">You cannot patch your way out of lawful instability. The vulnerability is in the game theory.</text>
</svg>
